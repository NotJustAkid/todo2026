<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>할 일 캘린더</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <p class="eyebrow">회원 전용 개인 캘린더</p>
          <h1>할 일 캘린더</h1>
        </div>
        <div class="account-bar" id="account-bar" hidden>
          <span id="account-name"></span>
          <button type="button" id="logout-button">로그아웃</button>
        </div>
      </header>

      <section id="auth-screen" class="auth-screen" hidden>
        <p class="eyebrow">나만의 캘린더</p>
        <h2 id="auth-title">로그인</h2>
        <p id="auth-description">로그인하면 내 할 일을 확인하고 관리할 수 있습니다.</p>
        <form id="auth-form" class="auth-form">
          <label for="auth-username">아이디</label>
          <input id="auth-username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" required />
          <label for="auth-password">비밀번호</label>
          <input id="auth-password" name="password" type="password" minlength="8" maxlength="200" autocomplete="current-password" required />
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <button type="submit" id="auth-submit">로그인</button>
        </form>
        <button type="button" id="auth-toggle" class="auth-toggle">계정이 없으신가요? 회원가입</button>
      </section>

      <div id="calendar-ui" hidden>
        <div class="view-switch" role="tablist" aria-label="보기 방식">
          <button type="button" role="tab" data-view="day" aria-selected="false">일</button>
          <button type="button" role="tab" data-view="week" aria-selected="false">주</button>
          <button type="button" role="tab" data-view="month" aria-selected="true">월</button>
        </div>
        <div class="toolbar">
          <div class="nav">
            <button type="button" id="prev" class="icon-btn" aria-label="이전">‹</button>
            <button type="button" id="today" class="today-btn">오늘</button>
            <button type="button" id="next" class="icon-btn" aria-label="다음">›</button>
          </div>
          <h2 id="period-label"></h2>
          <p id="summary" class="summary"></p>
        </div>

        <main id="view"></main>
      </div>
    </div>

    <dialog id="editor-dialog" aria-label="날짜별 할 일"></dialog>
    <script src="app.js"></script>
  </body>
</html>
